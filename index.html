<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="heading">Image Slider Library</h1>

  <div class="slider-wrapper">
    <!-- Viewport Mask -->
    <div class="slider-viewport">
      <div class="slider-track" id="sliderTrack">
        <div class="slide">
          <img src="images/bruno-bd-8i9ETArAeto-unsplash.jpg" alt="Slide 1">
        </div>
        <div class="slide">
          <img src="images/dl314-lin-5EUxh9RDkd4-unsplash.jpg" alt="Slide 2">
        </div>
        <div class="slide">
          <img src="images/leftfield-corn-0feWcMBMYcU-unsplash.jpg" alt="Slide 3">
        </div>
        <div class="slide">
          <img src="images/queensland-australia-HXMunKmZOJ4-unsplash.jpg" alt="Slide 4">
        </div>
        <div class="slide">
          <img src="images/wolfgang-hasselmann-Lx5Y37G0nlM-unsplash.jpg" alt="Slide 5">
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <button class="arrow arrow-left" id="prevBtn" type="button" aria-label="Previous Slide">&#10094;</button>
    <button class="arrow arrow-right" id="nextBtn" type="button" aria-label="Next Slide">&#10095;</button>
    
    <!-- Indicator Dots Container -->
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <script src="slider.js"></script>
</body>
</html>
